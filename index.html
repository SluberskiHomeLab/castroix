<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Castroix - Media Hub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Main container -->
  <div id="app" class="app-container">
    <!-- Home view -->
    <div id="home-view" class="home-view">
      <!-- Header -->
      <header class="header">
        <h1 class="title">Castroix</h1>
        <p class="subtitle">Media Hub for Multi-Media Consumption</p>
      </header>

      <!-- Services grid -->
      <div id="services-grid" class="services-grid">
        <!-- Services will be dynamically added here -->
      </div>

      <!-- Footer -->
      <footer class="footer">
        <div class="footer-hint">
          <span class="key-hint">↑↓←→</span> Navigate
          <span class="separator">•</span>
          <span class="key-hint">Enter</span> Select
          <span class="separator">•</span>
          <span class="key-hint">Esc</span> Back/Exit Fullscreen
          <span class="separator">•</span>
          <span class="key-hint">Ctrl+Q</span> Close Last App
          <span class="separator">•</span>
          <span class="key-hint">Ctrl+S</span> Manage Credentials
        </div>
      </footer>
    </div>

    <!-- Credentials management modal -->
    <div id="credentials-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Manage Credentials</h2>
          <button class="close-btn" onclick="closeCredentialsModal()">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="service-select">Service:</label>
            <select id="service-select" class="form-control">
              <!-- Services will be populated here -->
            </select>
          </div>
          <div class="form-group">
            <label for="username">Username/Email:</label>
            <input type="text" id="username" class="form-control" placeholder="Enter username or email">
          </div>
          <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" class="form-control" placeholder="Enter password">
          </div>
          <div class="form-actions">
            <button class="btn btn-primary" onclick="saveCredentials()">Save</button>
            <button class="btn btn-secondary" onclick="deleteCredentials()">Delete</button>
            <button class="btn btn-tertiary" onclick="closeCredentialsModal()">Cancel</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading overlay -->
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
