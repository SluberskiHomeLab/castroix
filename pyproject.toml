[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "castroix"
version = "1.0.0"
description = "A lightweight cross-platform media streaming launcher"
readme = "README.md"
requires-python = ">=3.6"
license = {text = "MIT"}
authors = [
    {name = "SluberskiHomeLab"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Video",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = [
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/SluberskiHomeLab/castroix"
Repository = "https://github.com/SluberskiHomeLab/castroix"
Issues = "https://github.com/SluberskiHomeLab/castroix/issues"

[project.scripts]
castroix = "castroix_package.__main__:main"

[project.gui-scripts]
castroix-gui = "castroix_package.__main__:main"

[tool.setuptools]
packages = ["castroix_package"]

[tool.setuptools.package-data]
"*" = ["*.png", "*.json"]
